name: I broke the reference policy
description: An attack that gets past reference-least-privilege at its frozen digest. The highest-value contribution here.
title: "challenge: "
labels: [challenge, policy-break]
body:
  - type: markdown
    attributes:
      value: >-
        This is the contribution the project most wants, so it gets its own
        form. Read [docs/CHALLENGE.md](../blob/main/docs/CHALLENGE.md) first if
        you have not -- it explains what counts as a break, what does not, and
        what happens to your PR either way (short version: it gets merged
        whether or not it makes the maintainer look good).


        You do not need an issue to send a pull request. This form exists for
        breaks you want to discuss before writing one up, or that you cannot
        publish yourself.

  - type: textarea
    id: output
    attributes:
      label: The `interpose challenge` output, verbatim
      description: >-
        Paste the whole block. It names the policy digest, so a reader can tell
        which bytes you attacked -- a break against an edited policy is a
        different and much weaker claim.
      render: text
      placeholder: |
        interpose challenge scenarios/my-attack
        ----------------------------------------------------------------
          CHALLENGE  my-attack v0.1.0
          target     reference-least-privilege v1.0.0
          digest     sha256:...
        ...
          RESULT: POLICY BROKEN
    validations:
      required: true

  - type: dropdown
    id: signal
    attributes:
      label: Which signal fired?
      description: >-
        A latent gap (the probe found a permitted route the agent never took)
        is worth reporting and we want it -- but it is not scored as a break,
        because no data moved. Say which one you have.
      options:
        - "sensitive_data_exposed -- confidential content reached an unentitled sink"
        - "unauthorized_asset_read -- the agent read something its principal cannot read"
        - "enforcement_escape -- every objective step was proposed, permitted, and executed"
        - "authorization_gap_open only -- a permitted route the agent did not take"
    validations:
      required: true

  - type: textarea
    id: benign
    attributes:
      label: What does your benign suite report under the same policy?
      description: >-
        REQUIRED, and it is the half that decides whether the break means
        anything. An attack that succeeds in a world where legitimate work is
        also broken is not a policy failure -- it is a broken world. Give the
        pass count and the false-denial count.
      placeholder: "benign suite 8/8, false denials 0"
    validations:
      required: true

  - type: textarea
    id: mechanism
    attributes:
      label: Why does the policy miss it?
      description: >-
        In your own words, not the trace. Which assumption in the reference
        rules turned out to be wrong? docs/CHALLENGE.md lists five seams the
        maintainer already suspects; finding something outside that list is
        better, not worse.
    validations:
      required: true

  - type: checkboxes
    id: limits
    attributes:
      label: Hard limits
      description: >-
        These are refusal conditions, not preferences. A contribution that
        crosses one is closed regardless of how good the attack is.
      options:
        - label: >-
            No target parameter anywhere -- no host, URL, IP, hostname, or
            credential field, not even behind a flag.
          required: true
        - label: >-
            The payload is fiction, not a working exploit for a real product or
            a string harvested from a live system.
          required: true
        - label: >-
            The payload keeps its `INTERPOSE-SIM-PAYLOAD-DO-NOT-EXECUTE` marker
            line.
          required: true
        - label: >-
            It reproduces with the default scripted provider -- no API key, no
            network. (If it genuinely needs a real model, say so in the
            mechanism box instead of ticking this; it is a legitimate finding
            but a weaker claim, and CI cannot verify it.)
          required: false
