[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "interpose"
version = "0.1.0"
description = "A regression test for the trust boundary in tool-using AI agents: does authorization hold when the model is fooled, and what does it cost?"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
keywords = ["ai-security", "prompt-injection", "authorization", "agent-security", "policy-enforcement"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Topic :: Security",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "pydantic>=2.7",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
# The Cedar policy adapters. Kept out of the default install deliberately: two
# runtime dependencies is one of the project's stronger adoption properties,
# and the Cedar rows are an ablation rather than part of the instrument.
cedar = ["cedarpy>=4.8"]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
interpose = "interpose.cli:main"

[project.urls]
Homepage = "https://github.com/OWNER/interpose"
Issues = "https://github.com/OWNER/interpose/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/interpose"]

[tool.hatch.build.targets.wheel.force-include]
# git does not track empty directories, so force-including one makes a fresh
# clone fail to build. Ship only what exists.
"scenarios" = "interpose/_bundled/scenarios"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
packages = ["interpose"]
mypy_path = "src"
strict_optional = true
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error"]
